services:
  db:
    container_name: sejong_voice_db
    image: mysql:8.0
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: sejong_voice
      TZ: UTC
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    container_name: sejong_voice_app
    image: ${DOCKERHUB_USERNAME}/sejong-voice:dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: UTC
      SPRING_PROFILES_ACTIVE: server
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}

      SSO_BASE_URL: ${SSO_BASE_URL}
      SSO_SESSIONS_PATH: ${SSO_SESSIONS_PATH}
      SSO_TIMEOUT_MS: ${SSO_TIMEOUT_MS}

      OCI_OBJECT_STORAGE_REGION: ${OCI_OBJECT_STORAGE_REGION}
      OCI_OBJECT_STORAGE_BUCKET: ${OCI_OBJECT_STORAGE_BUCKET}
      OCI_OBJECT_STORAGE_NAMESPACE: ${OCI_OBJECT_STORAGE_NAMESPACE}
    depends_on:
      - db
      - sso

  sso:
    container_name: sejong_voice_sso
    build:
      context: ../ssoPython
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"

volumes:
  mysql_data:
    external: true
    name: sejong_voice_mysql_data
