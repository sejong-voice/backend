name: sejong-voice

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: sejong_voice
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    image: ${DOCKERHUB_USERNAME}/sejong-voice:prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: UTC
      SPRING_PROFILES_ACTIVE: server
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}

      SSO_BASE_URL: ${SSO_BASE_URL}
      SSO_SESSIONS_PATH: ${SSO_SESSIONS_PATH}
      SSO_TIMEOUT_MS: ${SSO_TIMEOUT_MS}

      OCI_OBJECT_STORAGE_REGION: ${OCI_OBJECT_STORAGE_REGION}
      OCI_OBJECT_STORAGE_BUCKET: ${OCI_OBJECT_STORAGE_BUCKET}
      OCI_OBJECT_STORAGE_NAMESPACE: ${OCI_OBJECT_STORAGE_NAMESPACE}

      MANAGEMENT_SERVER_PORT: 18081
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      MANAGEMENT_METRICS_TAGS_APPLICATION: sejong-voice-api
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
    external: true
    name: sejong_voice_mysql_data_prod


networks:
  default:
    external: true
    name: sejong-voice_default
