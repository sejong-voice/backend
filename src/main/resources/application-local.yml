spring:
  application:
    name: sejong_voice

  datasource:
    url: jdbc:mysql://localhost:3306/sejong_voice?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: '1234'
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# JWT
jwt:
  secret-key: f6d5c7e9e813b1409f0e34b2a6c9d17bd2cdbbe8c4c7aa3e2f5d1a7c4f9b8e01
  issuer: sejong-voice
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

# Python SSO server
sso:
  base-url: http://127.0.0.1:8081
  sessions-path: /auth/sessions
  timeout-ms: 3000

# Swagger UI / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
