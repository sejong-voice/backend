spring.application.name=sejong_voice
spring.datasource.url=jdbc:mysql://localhost:3306/sejong_voice?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT ??
jwt.secret-key=${JWT_SECRET_KEY:your_default_secret_key_64_characters_long_for_safety}
jwt.issuer=sejong-voice
jwt.access-token-expiration=3600000 
jwt.refresh-token-expiration=1209600000


# Python SSO server
sso.base-url=http://127.0.0.1:8081
sso.sessions-path=/auth/sessions
sso.timeout-ms=3000

# Python profile activation
spring.profiles.active=local

# Swagger UI / OpenAPI docs path (??)
springdoc.swagger-ui.path=/swagger-ui.html
# springdoc.api-docs.path=/v3/api-docs  # ??? ??? ?? ? ?? ?